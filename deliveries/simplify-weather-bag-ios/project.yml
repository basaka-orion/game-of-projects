name: WeatherBagCompanion
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  WeatherBagCompanion:
    type: application
    platform: iOS
    sources:
      - path: WeatherBagCompanion
        excludes:
          - Assets.xcassets
    resources:
      - path: WeatherBagCompanion/Assets.xcassets
    info:
      path: WeatherBagCompanion/Info.plist
      properties:
        CFBundleDisplayName: 包包晴雨签
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 允许包包晴雨签读取当前位置，用当地实际天气生成出门清单。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openbasaka.simplify.weatherbag
        PRODUCT_NAME: WeatherBagCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
